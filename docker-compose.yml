version: '3.9'

volumes:
  postgres-data:
  redis-data:

networks:
  caddy:
    external: true # sua rede do proxy reverso
  internal:
    driver: overlay # swarm

services:
  api:
    image: brsktdev/decideai-api:main
    environment:
      PORT: 8080
      NODE_ENV: production
      DB_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/decideai
      REDIS_URL: redis://redis:6379
      # (opcionais) IA/Secrets:
      # GROQ_API_KEY: ${GROQ_API_KEY}
      # GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      # JWT_SECRET: ${JWT_SECRET}
      # JWT_ISSUER: decideai
      # JWT_AUDIENCE: decideai-users
    depends_on:
      - postgres
      - redis
    labels:
      caddy: api.decideai.app
      caddy.reverse_proxy: '{{upstreams 8080}}'
    networks: [caddy, internal]
    deploy:
      restart_policy: { condition: on-failure }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: decideai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d decideai']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy: { condition: on-failure }

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy: { condition: on-failure }
