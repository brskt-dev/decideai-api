name: Build & Push API (Docker Hub)

on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: brsktdev/decideai-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: t
        run: |
          echo "BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "SHA7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT
          if [ "${GITHUB_REF_NAME}" = "main" ]; then echo "LATEST=,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT; fi

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.t.outputs.BRANCH }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.t.outputs.BRANCH }}-${{ steps.t.outputs.SHA7 }}${{ steps.t.outputs.LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
